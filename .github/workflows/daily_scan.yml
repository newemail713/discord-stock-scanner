name: Daily Stock Breakout Scanner

on:
  schedule:
    - cron: '15 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests pandas numpy mplfinance yfinance six pyarrow matplotlib tzdata

      - name: Run All Scanners
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python scanner.py
          python swing_levels.py
          python bollinger_sniper.py
          python daily_reversal.py
          python daily_scanner.py
          python highs_lows.py
          python sniper_sma.py
          python sma20_mfi.py

      - name: Save updated market data
        run: |
          git config user.name "Scanner Bot"
          git config user.email "bot@://github.com"
          git add market_data.parquet market_caps.json sectors_cache.json || true
          git commit -m "Update daily stock data and caches" || exit 0
          git push
