name: Daily Stock Breakout Scanner

on:
  schedule:
    - cron: '15 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests pandas numpy matplotlib yfinance pyarrow

      - name: Run Market Scanner
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scanner.py

      - name: Save updated market data
        run: |
          git config user.name "Scanner Bot"
          git config user.email "bot@users.noreply.github.com"
          git add market_data.parquet
          git commit -m "Update daily US stock market data" || exit 0
          git push
